name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
  EXTENSION_NAME: trail

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail

          version="${VERSION#v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./public/manifest.json').version")"

          if [[ "${package_version}" != "${version}" ]]; then
            echo "package.json version ${package_version} does not match tag ${VERSION}" >&2
            exit 1
          fi

          if [[ "${manifest_version}" != "${version}" ]]; then
            echo "manifest.json version ${manifest_version} does not match tag ${VERSION}" >&2
            exit 1
          fi

          if ! grep -q "^## \\[${version}\\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section ## [${version}]" >&2
            exit 1
          fi

      - name: Build extension
        run: npm run build

  package:
    name: Package extension
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create release archive
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          EXTENSION_NAME: ${{ env.EXTENSION_NAME }}
        run: |
          set -euo pipefail

          artifact_base="${EXTENSION_NAME}_${VERSION}_chrome"
          mkdir -p release

          test -f dist/manifest.json
          (
            cd dist
            zip -r "../release/${artifact_base}.zip" .
          )

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-chrome-extension
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - verify
      - package
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download packaged artifact
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum * > checksums.txt

      - name: Build release notes from changelog
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          EXTENSION_NAME: ${{ env.EXTENSION_NAME }}
        run: |
          set -euo pipefail

          version="${VERSION#v}"
          notes_file="release-notes.md"

          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > "${notes_file}"

          if [[ ! -s "${notes_file}" ]]; then
            echo "No changelog entry found for version ${version}" >&2
            exit 1
          fi

          {
            echo "### 下载"
            echo
            echo "| 文件 | 说明 |"
            echo "|------|------|"
            echo "| \`${EXTENSION_NAME}_${VERSION}_chrome.zip\` | Chrome 扩展发布包 |"
            echo "| \`checksums.txt\` | SHA-256 校验和 |"
            echo
            echo "### 更新内容"
            echo
            cat "${notes_file}"
            echo
            echo "---"
            echo
            echo "[完整更新日志](https://github.com/${{ github.repository }}/blob/${VERSION}/CHANGELOG.md)"
          } > "${notes_file}.tmp"

          mv "${notes_file}.tmp" "${notes_file}"

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.1
        with:
          name: ${{ env.RELEASE_VERSION }} · Trail
          tag_name: ${{ env.RELEASE_VERSION }}
          body_path: release-notes.md
          files: release/*
          make_latest: true
