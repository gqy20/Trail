schema_version: 1

id: cnki-literature-results
name: 知网文献结果提取
description: 从当前知网检索结果页逐页提取题名、作者、来源、日期、文献类型和计数信息
version: 0.3.0

presentation:
  title: 文献采集
  source_label: 中国知网
  batch_input:
    label: 检索词
    placeholder: |-
      每行输入一个检索词
      例如：大语言模型
    item_label: 检索词
    count_unit: 个
    import_formats: [txt, csv]
    csv_headers: [检索词, 关键词, keyword, keywords, query, search_term, search term]
    composer:
      enabled: true
      label: 组合检索
      group_label: 词组
      placeholder: 每行输入一个词
      operators: [AND, OR]
      default_operator: AND
      max_groups: 4
  actions:
    run: 开始采集
    run_empty: 输入检索词后开始
    running: 正在检索…
    single_run: 只提取当前结果页
    single_running: 正在提取当前页…
  results:
    title: 本次采集
    item_label: 文献
    count_unit: 篇
    empty_title: 还没有文献结果
    empty_description: 输入检索词并完成一次采集后，结果会显示在这里。
  collections:
    literature:
      label: 文献
      item_label: 文献
      count_unit: 篇
      fields:
        _query: { label: 检索词, order: 10 }
        title: { label: 题名, order: 20, emphasis: primary }
        authors: { label: 作者, order: 30 }
        source: { label: 来源, order: 40 }
        published_at: { label: 发表时间, order: 50 }
        citation_count: { label: 被引, order: 60 }
        download_count: { label: 下载, order: 70 }
        database: { label: 类型, order: 80 }
        url: { label: 链接, order: 90, display: link }

match:
  domains:
    - kns.cnki.net
    - "*.cnki.mdjsf.utuvpn.utuedu.com"
  urls:
    - "*/kns8s/defaultresult/index*"

parameters:
  max_pages:
    type: number
    label: 提取页数
    required: true
    default: 3
    min: 1
    max: 20
    presentation:
      placement: primary
      style: sentence
      prefix: 每个检索词提取
      suffix: 页

selectors:
  result_rows: "table.result-table-list tbody tr"
  first_title: "table.result-table-list tbody tr:first-child td.name a.fz14"
  next_page: "#PageNext"

workflow:
  - action: wait_for
    selector: "{{ selectors.result_rows }}"
    timeout_ms: 20000

  - action: repeat
    max: "{{ parameters.max_pages }}"
    steps:
      - action: extract
        collection: literature
        selector: "{{ selectors.result_rows }}"
        fields:
          title:
            selector: "td.name a.fz14"
            attribute: text
            transforms: [normalize_whitespace]
          url:
            selector: "td.name a.fz14"
            attribute: href
          authors:
            selector: "td.author a"
            attribute: text
            transforms: [normalize_whitespace]
            multiple: true
            optional: true
          source:
            selector: "td.source a"
            attribute: text
            transforms: [normalize_whitespace]
            optional: true
          published_at:
            selector: "td.date"
            attribute: text
            transforms: [normalize_whitespace]
            optional: true
          database:
            selector: "td.data"
            attribute: text
            transforms: [normalize_whitespace]
            optional: true
          citation_count:
            selector: "td.quote"
            attribute: text
            transforms: [parse_number]
            optional: true
          download_count:
            selector: "td.download"
            attribute: text
            transforms: [parse_number]
            optional: true
    between:
      - action: click
        selector: "{{ selectors.next_page }}"
        optional: true
        stop_repeat_on_missing: true
        wait_for_change:
          selector: "{{ selectors.first_title }}"
          timeout_ms: 20000

batch:
  navigation:
    type: query_parameter
    parameter: kw
  max_keywords: 50
  delay_between_keywords_ms: 1200

downloads:
  - id: fulltext
    label: 全文下载
    collection: literature
    detail_url_field: url
    title_field: title
    formats:
      pdf:
        label: PDF
        selector: ".btn-dlpdf a"
        extension: pdf
      caj:
        label: CAJ
        selector: ".btn-dlcaj a[name='cajDown']:not(.chapterDown)"
        extension: caj
      chapter:
        label: 章节
        selector: "a.chapterDown"
    blockers:
      - selector: "#tCaptchaDyMainWrap"
        status: verification
        message: 页面需要完成安全验证，下载队列已暂停。
    allowed_domains:
      - bar.cnki.net
      - kns.cnki.net
      - "*.cnki.mdjsf.utuvpn.utuedu.com"
    max_items: 20
    delay_ms: 1200

limits:
  delay_between_actions_ms: 800
  max_records: 400
  require_user_activation: true
