schema_version: 1

id: example-literature-search
name: 示例文献搜索
description: 演示通用浏览器工具的搜索、等待和结果提取结构
version: 0.1.0

presentation:
  title: 示例数据采集
  source_label: Example Search
  batch_input:
    label: 搜索词
    placeholder: 每行输入一个搜索词
    item_label: 搜索词
    count_unit: 个
    import_formats: [txt, csv]
    csv_headers: [搜索词, keyword, query]
    composer:
      enabled: true
      label: 组合搜索
      group_label: 条件组
      operators: [AND, OR]
      default_operator: AND
      max_groups: 3
  actions:
    run: 开始搜索
    run_empty: 输入搜索词后开始
    running: 正在搜索…
  results:
    title: 本次结果
    item_label: 条目
    count_unit: 个
  collections:
    literature:
      label: 搜索结果
      item_label: 条目
      count_unit: 个
      fields:
        _query: { label: 搜索词, order: 10 }
        title: { label: 标题, order: 20, emphasis: primary }
        authors: { label: 作者, order: 30 }
        year: { label: 年份, order: 40 }
        url: { label: 链接, order: 50, display: link }

match:
  domains:
    - example.com
  urls:
    - "/search*"

parameters:
  keyword:
    type: string
    label: 检索关键词
    required: true

selectors:
  search_input: "form[role='search'] input[type='search']"
  search_button: "form[role='search'] button[type='submit']"
  result_list: "main .results"
  result_item: "main .results article"
  next_page: "a[rel='next']"

workflow:
  - action: wait_for
    selector: "{{ selectors.search_input }}"
    timeout_ms: 15000

  - action: fill
    selector: "{{ selectors.search_input }}"
    value: "{{ parameters.keyword }}"
    clear: true

  - action: click
    selector: "{{ selectors.search_button }}"
    wait_for_change:
      selector: "{{ selectors.result_list }}"
      timeout_ms: 20000

  - action: repeat
    max: 3
    steps:
      - action: extract
        collection: literature
        selector: "{{ selectors.result_item }}"
        fields:
          title:
            selector: "h2, h3"
            attribute: text
            transforms: [normalize_whitespace]
          url:
            selector: "h2 a, h3 a"
            attribute: href
          authors:
            selector: ".authors"
            attribute: text
            transforms: [split_authors]
            optional: true
          year:
            selector: "time, .year"
            attribute: text
            transforms: [parse_year]
            optional: true

      - action: click
        selector: "{{ selectors.next_page }}"
        optional: true
        stop_repeat_on_missing: true
        wait_for_change:
          selector: "{{ selectors.result_list }}"
          timeout_ms: 15000

batch:
  navigation:
    type: query_parameter
    parameter: q
  max_keywords: 25
  delay_between_keywords_ms: 1000

limits:
  delay_between_actions_ms: 500
  max_records: 100
  require_user_activation: true
