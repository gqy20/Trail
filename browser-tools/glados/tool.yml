schema_version: 1
id: glados-checkin
name: GLaDOS One 每日签到
version: "1.1.0"
description: 在 glados.one 登录会话中签到；按按钮 is-done 状态判定结果，中英文界面通用。
match:
  domains: [glados.one]
checkin:
  entry_url: https://glados.one/console/checkin
  timezone: Asia/Shanghai
presentation:
  title: 每日签到
  source_label: GLaDOS
  actions:
    single_run: 立即签到
  collections:
    account:
      label: 签到结果
      fields:
        points: { label: 当前积分, order: 10 }
        days: { label: 连续签到天数, order: 20 }
        days_left: { label: 剩余天数, order: 30 }
        plan: { label: 订阅计划, order: 35 }
        result: { label: 网站返回, order: 40 }
workflow:
  - action: wait_for
    selector: 'button.ckb'
    visible: true
    timeout_ms: 15000
    optional: true
  - action: if
    condition: { selector: 'button.ckb', visible: true }
    then:
      # 进入页面已是已签态：不点击，直接提取并结束。
      - action: if
        condition: { selector: 'button.ckb.is-done', visible: true }
        then:
          - action: extract
            collection: account
            selector: '#root'
            fields:
              points: { selector: '.checkin-stats-grid > div:nth-child(1) > div:last-child', transforms: [trim, parse_number] }
              days: { selector: '.checkin-stats-grid > div:nth-child(2) > div:last-child', transforms: [trim, parse_number] }
              days_left: { selector: '.checkin-stats-grid > div:nth-child(3) > div:last-child', transforms: [trim, parse_number] }
              plan: { selector: '.checkin-stats-grid > div:nth-child(4) > div:last-child', transforms: [trim] }
              result: { selector: 'button.ckb', transforms: [trim] }
          - action: finish
            outcome: already_done
            message: 今日已签到
      # 未签：点击并等待按钮进入 is-done 态（成功文案随站点语言变化，不作判定依据）。
      - action: click
        selector: 'button.ckb:not(.is-done)'
      - action: wait_for
        selector: 'button.ckb.is-done'
        timeout_ms: 15000
        optional: true
      - action: if
        condition: { selector: 'button.ckb.is-done', visible: true }
        then:
          - action: extract
            collection: account
            selector: '#root'
            fields:
              points: { selector: '.checkin-stats-grid > div:nth-child(1) > div:last-child', transforms: [trim, parse_number] }
              days: { selector: '.checkin-stats-grid > div:nth-child(2) > div:last-child', transforms: [trim, parse_number] }
              days_left: { selector: '.checkin-stats-grid > div:nth-child(3) > div:last-child', transforms: [trim, parse_number] }
              plan: { selector: '.checkin-stats-grid > div:nth-child(4) > div:last-child', transforms: [trim] }
              result: { selector: 'button.ckb', transforms: [trim] }
          - action: finish
            outcome: success
            message: 签到成功
      - action: pause_for_user
        reason: 点击签到后按钮未进入完成态，请打开页面确认（可能需要验证）后重试。
    else:
      - action: pause_for_user
        reason: 未找到 GLaDOS 签到按钮，请在 glados.one 完成登录或验证后重试。
